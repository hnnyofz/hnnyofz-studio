<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 实时像素预览</title>
<style>
:root{color-scheme:light;--paper:#eef2f7;--ink:#202d43;--muted:#53647d;--line:#bbc8d9;--blue:#325c9a;--pixel:#6d7694}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",sans-serif}main{max-width:1060px;padding:34px 24px 28px;margin:auto}header{display:flex;gap:24px;justify-content:space-between;align-items:baseline;margin-bottom:24px}h1{font-size:26px;margin:0;font-weight:650;letter-spacing:-.6px}p{line-height:1.8;margin:8px 0;color:var(--muted);font-size:14px}header output{font-variant-numeric:tabular-nums;font-size:30px;font-weight:550;white-space:nowrap}.stage{background:#dce4ef;border:1px solid var(--line);position:relative;border-radius:6px;overflow:hidden;touch-action:none;cursor:grab}.stage:active{cursor:grabbing}canvas{display:block;width:100%;aspect-ratio:2/1}.labels{position:absolute;top:15px;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}.labels span{margin-left:18px;font-size:13px;color:#445875}.stage:after{content:"";position:absolute;top:46px;bottom:18px;left:50%;border-left:1px solid #bbc8d9;pointer-events:none}.controls{border:0;margin:0;min-width:0;display:grid;grid-template-columns:1.8fr 1fr;gap:20px 38px;padding:24px 0;border-bottom:1px solid var(--line)}label,.control{display:block;font-size:14px}.control-title{display:flex;justify-content:space-between;margin-bottom:12px;gap:12px}input[type=number]{width:86px;font:inherit;text-align:right;background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px 6px;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--blue)}output{font-variant-numeric:tabular-nums}select,button{font:inherit;border:1px solid #acbcd2;border-radius:4px;padding:9px 13px;background:#fff;color:var(--ink)}button{cursor:pointer;min-width:80px}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.switches{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.switches label{display:flex;gap:6px;align-items:center}input[type=checkbox]{accent-color:var(--blue)}:focus-visible{outline:3px solid #7394c3;outline-offset:3px}.foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px}.foot p{font-size:12px;max-width:680px}.stat{font-size:12px;white-space:nowrap;color:var(--muted)}#error{padding:14px;color:#953920;background:#fff2e8;border:1px solid #c58b6b;margin-bottom:16px}#error[hidden]{display:none}@media(max-width:620px){main{padding:22px 16px}header{gap:12px;margin-bottom:16px}h1{font-size:22px}header output{font-size:24px}.controls{grid-template-columns:1fr;gap:22px}canvas{aspect-ratio:1/1}.labels{top:12px}.labels span{margin-left:12px;font-size:12px}.foot{display:block}.stage:after{top:40px}p{font-size:13px}.tools{justify-content:space-between}}
</style>
<main><header><div><h1>__TITLE__</h1><p>拖动模型连续旋转；像素效果由实体模型实时生成。</p></div><output id="angleText">0.0°</output></header>
<div id="error" role="alert" hidden></div>
<section class="stage" aria-label="左侧实时3D模型，右侧实时像素效果"><div class="labels"><span>实时 3D 原模</span><span>像素 shader</span></div><canvas id="view" aria-label="实时模型画布"></canvas></section>
<fieldset id="controls" class="controls" aria-label="实时渲染设置" disabled><label><span class="control-title"><span>旋转角度</span><input id="angleNumber" aria-label="旋转角度数值" type="number" min="0" max="359.9" step="0.1" value="0"></span><input id="angle" aria-label="旋转角度" type="range" min="0" max="359.9" step="0.1" value="0"></label>
<div class="control"><span class="control-title">播放</span><div class="tools"><button id="play" class="primary" aria-pressed="true">暂停</button><button id="reverse">反向</button><button id="reset">归零</button></div></div>
<label><span class="control-title"><span>旋转速度</span><output id="speedText">30° / 秒</output></span><input id="speed" aria-label="旋转速度" type="range" min="5" max="120" step="5" value="30"></label>
<label><span class="control-title">像素密度</span><select id="grid" aria-label="像素密度"><option value="32">32 × 32 · 接近原素材</option><option value="48">48 × 48</option><option value="64">64 × 64</option><option value="96">96 × 96</option></select></label>
<div class="switches"><label><input id="baseOnly" type="checkbox">仅看固定部件</label><label><input id="outline" type="checkbox" checked>像素描边</label><label><input id="structural" type="checkbox" checked>结构接缝</label><label><input id="palette" type="checkbox" checked>限定色板</label></div><div class="tools"><button id="capture">导出当前像素图</button></div></fieldset>
<label>相机 / 仰角 <select id="elevation"></select></label><label>导出间隔 <select id="exportStep"><option>5</option><option>15</option><option selected>30</option></select>°</label><button id="exportSequence">生成旋转 PNG ZIP</button> <a id="sequenceDownload" hidden>下载</a><details><summary>开发验收工具</summary><p><button id="sweep">导出旋转检查</button> <button id="diagnose">导出部件诊断</button></p><section id="diagnostics"></section></details><section id="saved" hidden aria-label="当前像素图导出"><img id="snapshot" alt="当前角度的透明像素截图" width="96" height="96" style="image-rendering:pixelated;background:#dce4ef"><p id="savedText"></p><a id="saveLink">下载透明 PNG</a></section><div class="foot"><p>实时 GPU 渲染。导出使用当前相机、密度与描边设置；不会替换成原图。</p><output id="stats">正在加载…</output></div></main>
<script id="model-data" type="application/json">__MODEL__</script><script type="module">__RUNTIME__</script></html>
